[package]
name = "gnfs"
version = "0.1.0"
edition = "2024"
description = "General Number Field Sieve: polynomial selection, sieving, and factorization"

[dependencies]
shared-bigint = { path = "../shared/bigint" }
shared-numfield = { path = "../shared/numfield" }
shared-numth = { path = "../shared/numth" }
shared-field = { path = "../shared/field" }
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
crypto-bigint = { version = "0.5", features = ["rand_core"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
