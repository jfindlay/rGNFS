[package]
name = "rho"
version = "0.1.0"
edition = "2024"
description = "Pollard rho: integer factorization and ECDLP with all canonical optimizations"

[[bin]]
name = "rho-factor"
path = "src/factor/cli.rs"

[[bin]]
name = "rho-dlog"
path = "src/ecdlp/cli.rs"

[dependencies]
gnfs = { path = "../gnfs" }
shared-field = { path = "../shared/field" }
shared-bigint = { path = "../shared/bigint" }
shared-numth = { path = "../shared/numth" }
shared-padic = { path = "../shared/padic" }
shared-numfield = { path = "../shared/numfield" }
shared-gf2m = { path = "../shared/gf2m" }
crypto-bigint = { version = "0.5", features = ["rand_core"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
crossbeam-channel = "0.5"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
k256 = { version = "0.13", features = ["arithmetic"] }
p256 = { version = "0.13", features = ["arithmetic"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "field"
harness = false

[[bench]]
name = "factor"
harness = false

[[bench]]
name = "ecdlp"
harness = false
